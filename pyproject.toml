[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sa2-migration-harness"
version = "0.1.0"
description = "Technical demonstration project for async SQLAlchemy 2 and Pydantic 2."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20",
    "pydantic>=2.7",
    "pytest>=8.2",
    "pytest-asyncio>=0.23.7",
    "mypy>=1.10",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
